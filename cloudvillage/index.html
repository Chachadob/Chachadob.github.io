<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구름 마을 Cloud Village · 스튜디오 차안</title>
<meta name="description" content="구름 마을(Cloud Village) — 스튜디오 차안이 준비 중인 완전 무료 게임.">
<meta property="og:title" content="구름 마을 Cloud Village">
<meta property="og:description" content="준비 중인 완전 무료 게임 · A completely free game in development">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chachadob.github.io/cloudvillage/">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0f13; --panel: #151a20; --line: #2b343f;
    --fg: #e9edf1; --muted: #8693a1; --accent: #f2a93b; --teal: #13857f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); line-height: 1.6;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  a { color: inherit; }
  .top { max-width: 760px; margin: 0 auto; padding: 16px; font-size: 14px; }
  .top a { color: var(--muted); text-decoration: none; }
  .top a:hover { color: var(--fg); }
  .studio { display: inline-flex; align-items: center; gap: 10px; }
  .studio .mark { display: block; background: #fff; border-radius: 8px; padding: 4px 6px; box-shadow: 0 0 0 1px var(--line); }
  .studio .mark img { display: block; height: 22px; width: auto; }
  .studio span:last-child { display: flex; flex-direction: column; line-height: 1.2; color: var(--fg); font-weight: 600; font-size: 14px; }
  .studio small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .studio:hover .mark { box-shadow: 0 0 0 2px var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 32px; text-align: center; }

  .sky { position: relative; height: 220px; border-radius: 24px; overflow: hidden; margin: 8px 0 28px;
    background: linear-gradient(180deg, #8ec9f2 0%, #cfe9fb 65%, #fdf3d8 100%); box-shadow: 0 0 0 2px var(--line); }
  .cloud { position: absolute; background: #fff; border-radius: 999px; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 999px; }
  .c1 { width: 140px; height: 40px; left: 12%; top: 62px; }
  .c1::before { width: 64px; height: 64px; left: 22px; top: -32px; }
  .c1::after { width: 48px; height: 48px; left: 70px; top: -20px; }
  .c2 { width: 110px; height: 32px; right: 14%; top: 118px; opacity: .92; }
  .c2::before { width: 50px; height: 50px; left: 18px; top: -26px; }
  .c2::after { width: 38px; height: 38px; left: 56px; top: -14px; }
  .c3 { width: 70px; height: 22px; left: 46%; top: 36px; opacity: .8; }
  .c3::before { width: 32px; height: 32px; left: 12px; top: -16px; }
  .c3::after { width: 0; height: 0; }

  h1 { font-size: 30px; margin: 0; }
  .en { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
  .soon { margin: 20px auto 0; max-width: 520px; }
  .tag { display: inline-block; margin-top: 16px; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--teal); color: #7fd6cf; }

  footer { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  footer nav { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; }
  footer a { color: var(--fg); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer a.todo { color: var(--muted); pointer-events: none; }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
<div class="top"><a class="studio" href="../" aria-label="스튜디오 차안 메인으로"><span class="mark"><img src="../assets/studio_logo.png" alt="" width="720" height="345"></span><span>스튜디오 차안<small>Studio Chaahn</small></span></a></div>
<main>
  <div class="sky" aria-hidden="true"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span></div>
  <h1>구름 마을</h1>
  <p class="en">Cloud Village</p>
  <p class="soon">지금 열심히 준비하고 있어요. 완전 무료 게임으로 찾아갈게요.<br>
    <span class="en">Coming soon — a completely free game.</span></p>
  <span class="tag">준비 중 · In development</span>
</main>
<footer>
  <nav>
    <!-- 개인정보처리방침: 노션 공개 페이지 URL 이 정해지면 href 를 바꾸고 class="todo" 를 지운다 -->
    <a class="todo" href="#" id="privacy">개인정보처리방침 · Privacy Policy (준비 중)</a>
    <a href="mailto:studiochaahn@gmail.com">문의 · Contact</a>
    <a href="../">스튜디오 차안 · Studio Chaahn</a>
  </nav>
  <p>© 2026 스튜디오 차안 (Studio Chaahn)</p>
</footer>
</body>
</html>
